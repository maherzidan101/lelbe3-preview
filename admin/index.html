device location consent means we cannot rank by distance. Withdrawing consent to identity verification means you cannot bid, run auctions, or list high value items. Withdrawing consent to message screening is not possible while you use messaging, because screening is how we keep messaging safe; you can stop using messaging instead.\n\n13.4 Withdrawing consent to the Terms of Use themselves means you can no longer use lelbe3, and we will close your account. See `CONSENT-SPEC.md` clause 7.\n\n## 14. Children\n\n14.1 lelbe3 is for people aged 18 and over. We do not knowingly collect data about children.\n\n14.2 If we learn that an account belongs to a child we close it and delete the data, except what we must keep to prove we acted.\n\n14.3 If you believe a child is using lelbe3, tell us at [PRIVACY CONTACT ADDRESS].\n\n## 15. Cookies and similar technologies\n\n15.1 On the website we use:\n   (a) **strictly necessary** cookies for sign-in, security and load balancing. These cannot be turned off;\n   (b) **preference** cookies for language and country;\n   (c) **analytics** cookies to count usage and find faults;\n   (d) **bot protection** from our security provider.\n\n15.2 We do not use advertising cookies and we do not allow third party advertising trackers.\n\n15.3 Where the law of your country requires consent for non-essential cookies, we ask before setting them, and the banner offers refusal as prominently as acceptance. Your choice is recorded like any other consent.\n\n15.4 In the mobile applications we use device identifiers for crash reporting and fraud prevention, and push notification tokens if you enable notifications.\n\n## 16. Security\n\n16.1 Data is encrypted in transit and at rest. Access by staff is role based, individually authenticated, and logged.\n\n16.2 Identity documents have their own stricter access rules (clause 6.3).\n\n16.3 If a breach happens that is likely to harm you, we will tell you and the authority in your country, within the period your country's law requires.\n\n16.4 No system is perfect. Do not put anything in a message or a listing that would harm you if it became public.\n\n## 17. Changes to this policy\n\n17.1 Any change produces a new version number and effective date.\n\n17.2 If a change materially affects how we use your data, we tell you before it takes effect and, where the law requires it, we ask for consent again. See `CONSENT-SPEC.md` clause 6.\n\n17.3 You can always read the version you accepted and when you accepted it in the legal section of your profile.\n\n## 18. Complaints\n\n18.1 Contact us first at [PRIVACY CONTACT ADDRESS]. We will reply within [30] days.\n\n18.2 If you are not satisfied, you may complain to the data protection or telecommunications authority in your country. Annex B names the authority per country.\n\n18.3 You may also go to court. Nothing here removes that right.\n\n## 19. Language\n\n19.1 This policy exists in Arabic and English, both at version 1.0, with identical clause numbers. The Arabic version governs.\n\n19.2 All numbers are written in Latin digits.\n\n---\n\n# Annex B: data protection per country\n\n> **DRAFT. Every row must be confirmed by a local data protection lawyer before launch in that country. Where a row says \"to be confirmed\", the country must not be launched.**\n\n| # | Country | Main data protection instrument | Registration, licence or local representative required | Restrictions on transfer abroad | Supervisory authority | Status |\n|---|---|---|---|---|---|---|\n| 1 | Iraq | No comprehensive data protection law; constitutional privacy protection and sectoral rules | To be confirmed | To be confirmed | To be confirmed | Draft |\n| 2 | Egypt | Personal Data Protection Law 151 of 2018 and its executive regulations | Licence or permit and a data protection officer are expected; transfers need approval | To be confirmed | Data Protection Centre | Draft, high risk |\n| 3 | Saudi Arabia | Personal Data Protection Law and implementing regulations | Registration and conditions on transfer abroad | To be confirmed | SDAIA | Draft, high risk |\n| 4 | United Arab Emirates | Federal Decree Law 45 of 2021 on personal data protection, plus free zone regimes | To be confirmed | To be confirmed | UAE Data Office | Draft |\n| 5 | Qatar | Law 13 of 2016 on personal data privacy protection | To be confirmed | To be confirmed | Compliance and Data Protection Department | Draft |\n| 6 | Oman | Royal Decree 6 of 2022 personal data protection law | To be confirmed | To be confirmed | Ministry of Transport, Communications and IT | Draft |\n| 7 | Bahrain | Law 30 of 2018 on personal data protection | Registration or notification is expected for some processing | To be confirmed | Personal Data Protection Authority | Draft |\n| 8 | Jordan | Personal Data Protection Law of 2023 | To be confirmed | To be confirmed | Personal Data Protection Council | Draft |\n| 9 | Lebanon | Law 81 of 2018 on electronic transactions and personal data | A prior licence or declaration for some processing is expected | To be confirmed | Ministry of Economy and Trade | Draft |\n| 10 | Kuwait | CITRA data privacy protection regulation | To be confirmed | To be confirmed | CITRA | Draft |\n| 11 | [ELEVENTH COUNTRY NOT YET NAMED] | | | | | Open question |\n\nB.1 The table above is a drafting aid, not legal advice, and it may be out of date. Each row must be verified against the current text of the instrument and its executive regulations before launch.\n\nB.2 Processing biometric or identity document data raises the requirement level in most of these countries. The identity verification flow must be assessed separately per country.\n"}}, {"id": "prohibited-items", "titleAr": "الأغراض الممنوعة", "titleEn": "Prohibited Items", "version": "1.0", "status": "draft", "body": {"ar": "# السلع الممنوعة والمقيّدة\n\n> **مسودة قيد المراجعة القانونية.** لم تُراجَع هذه القائمة من محامٍ مرخّص في أي من دول التشغيل. وقواعد الاستيراد والبيع والحيازة والإعلان تختلف في كل دولة من الدول الواردة في البند 6، وبعض ما ورد أدناه يشكّل جريمة في بعضها. ويجب مراجعة القائمة دولةً دولةً قبل النشر. راجع `LAWYER-BRIEF.md`.\n\n**معرّف الوثيقة:** `prohibited-items`\n**رقم الإصدار:** 1.0\n**تاريخ النفاذ:** [تاريخ النفاذ]\n**اللغتان:** العربية (`ar`) والإنجليزية (`en`)، وكلتاهما بالإصدار 1.0 وبترقيم بنود متطابق.\n**اللغة الحاكمة:** **العربية.** عند الاختلاف تُرجَّح النسخة العربية.\n\n---\n\n## 1. ماهية هذه القائمة\n\n1.1 هذه القائمة جزء من شروط الاستخدام، ومخالفتها مخالفة للشروط.\n\n1.2 لِلبيع مخصص للسلع المادية المستعملة، تُباع بين أشخاص داخل الدولة نفسها، وتُسلَّم يداً بيد، ويُدفع ثمنها نقداً.\n\n1.3 وعدم ورود سلعة في هذه القائمة لا يعني أنها مسموحة. وأنت مسؤول عن معرفة قانون دولتك. وإن لم تكن على يقين فلا تنشرها.\n\n1.4 ويجوز لنا إزالة أي إعلان في أي وقت، ولو لم تكن السلعة مذكورة هنا، متى رأيناها غير آمنة أو غير مشروعة أو غير مناسبة للِلبيع.\n\n## 2. كيف تُقرأ هذه القائمة\n\n2.1 **البند 3 هو قائمة المنع المطلق:** لا يجوز عرض هذه السلع إطلاقاً على لِلبيع، بأي حال ولا بأي سعر.\n\n2.2 **البند 4 هو قائمة الشروط:** يجوز عرض هذه السلع بشرط استيفاء الشروط.\n\n2.3 **والبند 5 يضيف قواعد للسلع التي قد تؤذي.**\n\n2.4 **والبند 6 يبيّن الفروق بين الدول،** فقد تُسمح سلعة في دولة وتُمنع في أخرى، والقاعدة المحلية هي الحاكمة دائماً.\n\n## 3. الممنوع منعاً مطلقاً\n\n3.1 السلع المسروقة، أو ما لديك سبب للاعتقاد بأنه مسروق، ومنه ما أُزيل أو خُدش أو غُيّر رقمه التسلسلي، والهواتف المبلّغ عن فقدها أو سرقتها أو المرتبطة بحساب شخص آخر.\n\n3.2 السلع المقلّدة والنسخ والمحاكاة و\"الكوبي\" و\"الدرجة الأولى\" وكل ما يحمل علامة لم يُصنع تحتها. وبيع المقلّد جريمة في كل دولة نعمل فيها.\n\n3.3 الأسلحة وكل ما صُمم للإيذاء: الأسلحة النارية وذخائرها وأجزاؤها ومخازنها، وأسلحة الهواء، والأسلحة المقلّدة، والصواعق الكهربائية، والمدقّات المعدنية، والسيوف وسكاكين القتال، والهراوات، ورذاذ الفلفل، والدروع الواقية حيث تكون مقيّدة.\n\n3.4 المتفجرات والألعاب النارية والشهب والبارود والمفجّرات.\n\n3.5 المخدرات والمواد الخاضعة للرقابة وكل ما يُستعمل في تعاطيها أو تصنيعها، بما في ذلك الموازين المعروضة لهذا الغرض.\n\n3.6 الأدوية الموصوفة والأدوية البيطرية والحقن وأي دواء كان، مفتوحاً أو مغلقاً، منتهي الصلاحية أو ساريها.\n\n3.7 الأجهزة الطبية التي تستلزم وصفة أو ترخيصاً، والعدسات اللاصقة بما فيها التجميلية، والسماعات الطبية، والتركيبات السنّية، وكل مستعمل يدخل الجسم.\n\n3.8 الكحول وعدد إنتاجه والمنتجات غير الكحولية المعروضة كبدائل له حيث يمنعها القانون المحلي.\n\n3.9 التبغ ومعسل الشيشة والسجائر الإلكترونية وأجهزة التبخير وسوائلها وأكياس النيكوتين.\n\n3.10 لحم الخنزير ومشتقاته.\n\n3.11 معدات القمار وتذاكر اليانصيب وأجهزة المراهنات وأدوات الكازينو.\n\n3.12 الآثار والقطع الأثرية والعملات والمقتنيات المستخرجة من أي موقع وكل ما قد يُعدّ ملكية ثقافية. ويشتد ذلك في العراق ومصر والأردن ولبنان حيث يشكّل الاتجار بالآثار جريمة جسيمة.\n\n3.13 الأحياء البرية المحمية وما يُصنع منها: العاج، وقرن وحيد القرن، والمرجان، وصدف السلاحف، والفراء والجلود المحمية، والصقور والجوارح، وكل حيوان أو نبات مدرج ضمن المهددة بالانقراض.\n\n3.14 الحيوانات الحية بجميع أنواعها وأجزاء الحيوانات.\n\n3.15 الرفات البشري والأعضاء والدم والشعر المباع مع نسيج بشري وسوائل الجسم.\n\n3.16 الوثائق الرسمية وما يحاكيها: بطاقات الهوية وجوازات السفر ورخص القيادة والإقامات ودفاتر تسجيل المركبات والشهادات والأختام والأتربة الرسمية.\n\n3.17 الأزياء والشارات والرتب ومعدات الشرطة أو الجيش أو أي جهة حكومية.\n\n3.18 شرائح الاتصال والأرقام المسجّلة والبطاقات المصرفية والمحافظ الإلكترونية وأي حساب له بيانات دخول، بما في ذلك حسابات التواصل الاجتماعي وحسابات الألعاب.\n\n3.19 معدات المراقبة والاعتراض: الكاميرات المخفية وأجهزة التجسس وأجهزة التشويش وكواشف الرادار وأجهزة اعتراض الاتصالات وأجهزة التتبع المعروضة للاستخدام الخفي وبرامج اعتراض الاتصالات.\n\n3.20 الأجهزة والبطاقات المعروضة لاستقبال البث المدفوع أو خدمات المشاهدة دون سداد قيمتها.\n\n3.21 العملات والشيكات والأوراق المالية والذهب أو الفضة المعروضة كمنتج استثماري والعملات المشفّرة وأجهزة التعدين المعروضة بوعد عائد وبطاقات الهدايا والقسائم والنقاط.\n\n3.22 البيانات الشخصية وقوائم جهات الاتصال وقوائم العملاء والوثائق المنسوخة وكل ما يحوي معلومات شخص آخر.\n\n3.23 المواد الإباحية والمواد الجنسية الصريحة والألعاب الجنسية وكل ما يخدش الحياء.\n\n3.24 كل ما يمسّ ديناً أو يروّج للكراهية أو يحرّض على العنف أو يُمنع لمخالفته النظام العام أو الآداب العامة في دولة الإعلان.\n\n3.25 المنتجات المسحوبة من السوق وكل سلعة خاضعة لسحب سلامة من الشركة الصانعة.\n\n3.26 مقعد سيارة للأطفال تعرّض لاصطدام، أو تجاوز تاريخ صلاحيته، أو مجهول التاريخ، أو ناقص أجزاء السلامة الأصلية.\n\n3.27 معدات السلامة منتهية الصلاحية: طفايات الحريق المتجاوزة موعد الصيانة، وسترات النجاة والخوذ وأجهزة إنذار الدخان منتهية الصلاحية.\n\n3.28 الوسائد الهوائية وأحزمة الأمان ذات الشدّ التفجيري وسائر أجزاء المركبات ذات المكوّن التفجيري.\n\n3.29 المواد الكيميائية الخطرة والمبيدات والمذيبات الصناعية والزئبق والأسبستوس وما يحتويه وغازات التبريد ودهانات الرصاص.\n\n3.30 الملابس الداخلية المستعملة وملابس السباحة والجوارب المستعملة ومستحضرات التجميل المستعملة والعطور والعناية المفتوحة وشفرات الحلاقة وفرش الأسنان وحلي الثقب المستعملة.\n\n3.31 حليب الأطفال والمكمّلات الغذائية وأي طعام مفتوح أو غير مبيّن البيانات أو منتهي التاريخ أو يستلزم التبريد.\n\n3.32 أدوات فتح الأقفال وتجاوزها وأجهزة نسخ البطاقات وكل أداة غرضها الأساسي السرقة أو الاحتيال.\n\n3.33 الخدمات بجميع أنواعها والأعمال والوظائف والإيجارات والعقارات والسلع الرقمية والتنزيلات وتراخيص البرمجيات والاشتراكات وكل ما ليس شيئاً مادياً يُسلَّم يداً بيد.\n\n3.34 السلع المعروضة مجاناً مقابل دفعة أولاً، و\"تضاعف المال\"، وكل إعلان غرضه تحريك أموال لا تسليم شيء.\n\n3.35 كل ما يمنع قانون دولة الإعلان بيعه أو حيازته أو استيراده أو الإعلان عنه.\n\n## 4. المسموح بشروط\n\n4.1 **الهواتف والأجهزة اللوحية والحواسيب.** يجب بيان الطراز والسعة والحالة. وألا يكون الجهاز مرتبطاً بحساب شخص آخر، ولا مبلّغاً عن فقده أو سرقته، وأن يكون رقمه التسلسلي سليماً. وعليك إزالة حساباتك ومسح بياناتك قبل التسليم.\n\n4.2 **السلع ذات العلامات التجارية.** يجب أن تملك السلعة وتصفها بصدق وتصوّر السلعة ذاتها. وإن لم يمكنك إثبات أصالة قطعة مصمّم فلا تصفها بالأصلية. وإن ساورنا الشك أزلنا الإعلان.\n\n4.3 **المجوهرات والمعادن الثمينة.** يجب بيان المعدن والوزن ووجود دمغة أو شهادة من عدمه. ولا تصف الأحجار بالطبيعية دون دليل. وبعض الدول تشترط ترخيصاً للاتجار بالذهب بصفة تاجر.\n\n4.4 **المركبات والدراجات النارية وقطع غيارها.** يجب أن تكون المالك المسجّل أو حاملاً لتفويض مكتوب. وبيّن المسافة المقطوعة وتاريخ الحوادث وأي تمويل قائم. ونقل الملكية يخضع لقانون دولتك وهو مسؤوليتكما لا مسؤوليتنا. والوسائد الهوائية ممنوعة بموجب البند 3.28.\n\n4.5 **الدراجات والسكوترات الكهربائية.** يجب بيان رقم الهيكل أو الرقم التسلسلي، ونزيل أي إعلان أُزيل منه الرقم.\n\n4.6 **الطائرات المسيّرة والطائرات اللاسلكية.** فقط حيث تجيز الدولة بيعها بين الأفراد، والتسجيل والترخيص مسؤولية البائع والمشتري.\n\n4.7 **العدد والآلات والعدد الكهربائية.** يجب أن تكون مكتملة بأغطية الحماية وأجزاء السلامة وأن تعمل كما وُصفت.\n\n4.8 **السكاكين.** سكاكين المطبخ وأدوات العمل ومعدات التخييم مسموحة، وكل ما صُمم سلاحاً ممنوع بموجب البند 3.3.\n\n4.9 **الكتب والأفلام والموسيقى والألعاب.** يجب ألا تكون نسخاً مقرصنة وألا تتضمن ما يمنعه البند 3.24، والمصنّفات العمرية لا تُباع إلا لمن بلغ السن المقرر.\n\n4.10 **تذاكر الفعاليات.** فقط حيث تجيز الدولة والجهة المنظّمة إعادة البيع، وبالقيمة الاسمية أو أقل، ولا تُباع تذاكر أداء ديني إطلاقاً.\n\n4.11 **الأطعمة والمشروبات المغلقة.** فقط غير المفتوحة وسارية الصلاحية وصحيحة البيانات ولا تستلزم تبريداً.\n\n4.12 **الملابس والأحذية.** يجب أن تكون نظيفة وخالية من تلف غير مذكور، وراجع البند 3.30 لما لا يجوز بيعه مستعملاً إطلاقاً.\n\n4.13 **الأثاث والمراتب.** يجب أن تكون نظيفة وخالية من الحشرات، مع بيان أي بقع أو تلف أو إصلاح. وبعض الدول تقيّد إعادة بيع المراتب المستعملة.\n\n4.14 **مقاعد سيارات الأطفال والأسرّة والعربات ومستلزمات الأطفال.** راجع البند 5.\n\n4.15 **الأجهزة الكهربائية والشواحن والبطاريات وبنوك الطاقة.** راجع البند 5.\n\n4.16 **أجهزة الغاز والأسطوانات والمدافئ والسخانات.** يجب أن تكون الأسطوانات فارغة وسارية وغير تالفة، وبعض الدول تمنع إعادة بيعها بين الأفراد كلياً.\n\n4.17 **الخوذ وسترات النجاة ومعدات الوقاية.** فقط إذا كانت سارية الصلاحية ولم تتعرض لصدمة وكانت مكتملة.\n\n4.18 **التحف التي ليست آثاراً.** الأثاث والساعات والمقتنيات المنزلية القديمة مسموحة، وكل مستخرج من الأرض أو ذي دلالة أثرية أو دينية ممنوع بموجب البند 3.12.\n\n## 5. قواعد إضافية للسلع التي قد تؤذي\n\n5.1 إذا عرضت أياً مما يلي فعليك بيان عمره وما إذا تعرّض لحادث وما إذا جرى إصلاحه وما إذا كان مكتملاً: مقاعد سيارات الأطفال، والأسرّة ومراتبها، والعربات، والكراسي المرتفعة، وحمّالات الأطفال، وبوابات السلالم، والأجهزة الكهربائية والأسلاك والشواحن وبنوك الطاقة والبطاريات، وأجهزة الغاز والمدافئ، والخوذ، والسلالم، والعدد الكهربائية.\n\n5.2 لا يجوز عرض مقعد سيارة للأطفال إلا إذا كنت مالكه الأول، وأمكنك بيان تاريخ صنعه، وكان ضمن مدة صلاحيته، ولم يتعرض لاصطدام قط، وكان مكتملاً بأحزمته وقاعدته الأصلية. وما عدا ذلك ممنوع بموجب البند 3.26.\n\n5.3 يجب أن تكون السلعة الكهربائية مكتملة، وخالية من أسلاك مكشوفة أو مُصلَحة، وذات قابس أصلي أو بديل صحيح، وألا تكون شاحناً مقلّداً.\n\n5.4 يجب ألا تكون البطارية أو بنك الطاقة منتفخاً أو مثقوباً أو ساقطاً أو مقلّداً لعلامة.\n\n5.5 وإذا اشتريت سلعة من هذه فافحصها قبل الدفع وتحقق من أي سحب من الشركة الصانعة. فلِلبيع لا يفحص السلع ولا يتحقق من عمليات السحب.\n\n5.6 ويجوز لنا إزالة أي إعلان يقع تحت هذا البند دون إخطار متى لم نطمئن إلى سلامته، ولسنا ملزمين ببيان سبب عدم اطمئناننا.\n\n## 6. الفروق بين الدول\n\n6.1 هذه القائمة هي الحد الأدنى، وكل دولة تضيف إليها.\n\n6.2 ويجب اعتماد قواعد الدول التالية من محامٍ محلي قبل الإطلاق، وإلى حين ذلك تُطبَّق القاعدة الأشد في كل الدول.\n\n| الدولة | السلع التي تستلزم قاعدة محلية خاصة |\n|---|---|\n| العراق | الآثار، الأسلحة، معدات الاتصالات، العملات |\n| مصر | الآثار، الأدوية، معدات الاتصالات، الكحول، العملات |\n| السعودية | الكحول، لحم الخنزير، المواد الدينية، المصنّفات، الأسلحة، معدات الاتصالات، الاتجار بالذهب |\n| الإمارات | الكحول، لحم الخنزير، المصنّفات، الطائرات المسيّرة، معدات الاتصالات، السجائر الإلكترونية |\n| قطر | الكحول، لحم الخنزير، المصنّفات، الطائرات المسيّرة، معدات الاتصالات |\n| عُمان | الكحول، الأسلحة، الأحياء البرية، المصنّفات |\n| البحرين | الكحول، المصنّفات، معدات الاتصالات |\n| الأردن | الآثار، الأسلحة، الأدوية |\n| لبنان | الآثار، الأسلحة، الأدوية، العملات |\n| الكويت | الكحول، لحم الخنزير، المصنّفات، الأسلحة، معدات الاتصالات |\n\n6.3 وحيث تمنع دولة سلعة تجيزها هذه القائمة، تسود قاعدة الدولة ويُزال الإعلان.\n\n## 7. أثر مخالفة هذه القائمة\n\n7.1 يُزال الإعلان.\n\n7.2 وبحسب نوع المخالفة قد تفقد حق النشر أو يُوقف حسابك أو يُغلق نهائياً.\n\n7.3 وفي البنود 3.1 و3.2 و3.3 و3.5 و3.12 و3.13 و3.15 و3.16 و3.19 نغلق الحساب فوراً، ونبلّغ الجهات المختصة حيث يوجب القانون، ونحفظ السجلات.\n\n7.4 ولا نردّ مقابلاً ولا نعوّض ولا نعيد إعلانات أُزيلت بموجب هذه الوثيقة.\n\n7.5 ولك التظلم على [عنوان التظلمات]، ويراجع موظف بشري تظلمات إغلاق الحساب.\n\n## 8. الإبلاغ عن إعلان\n\n8.1 استخدم زر الإبلاغ في أي إعلان، أو راسلنا على [عنوان السلامة].\n\n8.2 وإن رأيت أن سلعة مسروقة فأبلغ الشرطة أولاً ثم أبلغنا برقم البلاغ، وسنحفظ السجل ونستجيب لأي طلب مشروع من الشرطة.\n\n8.3 وإن كنت مالك علامة تجارية ورأيت إعلاناً لسلعة مقلّدة فراسلنا على [عنوان التواصل بشأن الملكية الفكرية] مرفقاً دليل الحق.\n\n## 9. التعديل واللغة\n\n9.1 نحدّث هذه القائمة مع تغيّر القانون ومع تراكم الخبرة، وكل تعديل يُنتج رقم إصدار وتاريخ نفاذ جديدين.\n\n9.2 والتعديل الذي يضيف منعاً يسري فوراً على الإعلانات الجديدة، وتُزال الإعلانات القائمة للسلعة الممنوعة حديثاً.\n\n9.3 وتصدر هذه الوثيقة بالعربية والإنجليزية، وكلتاهما بالإصدار 1.0 وبترقيم بنود متطابق، والنسخة العربية هي الحاكمة.\n\n9.4 وتُكتب جميع الأرقام بالأرقام اللاتينية.\n", "en": "# Prohibited and Restricted Items\n\n> **DRAFT, PENDING LEGAL REVIEW.** This list has not been reviewed by a qualified lawyer in any operating country. Import, sale, possession and advertising rules differ in each of the countries in clause 6, and several items below are criminal offences in some of them. The list must be reviewed country by country before publication. See `LAWYER-BRIEF.md`.\n\n**Document id:** `prohibited-items`\n**Version:** 1.0\n**Effective date:** [EFFECTIVE DATE]\n**Languages:** Arabic (`ar`) and English (`en`). Both versions carry version 1.0 and identical clause numbering.\n**Governing language:** **Arabic.** If the two versions differ, the Arabic version prevails.\n\n---\n\n## 1. What this list is\n\n1.1 This list is part of the Terms of Use. Breaking it breaks the Terms.\n\n1.2 lelbe3 is for physical second hand items sold between people in the same country, handed over in person, paid in cash.\n\n1.3 If an item is not on this list, that does not mean it is allowed. You are responsible for knowing the law of your own country. If you are not sure, do not list it.\n\n1.4 We may remove any listing at any time, even if the item is not named here, if we consider it unsafe, unlawful, or wrong for lelbe3.\n\n## 2. How to read this list\n\n2.1 **Clause 3 is the never list.** These items may not be listed at all, anywhere on lelbe3, in any condition, at any price.\n\n2.2 **Clause 4 is the conditions list.** These items may be listed, but only if the conditions are met.\n\n2.3 **Clause 5 adds rules for items that can hurt someone.**\n\n2.4 **Clause 6 lists country differences.** An item allowed in one country may be forbidden in another. The country rule always wins.\n\n## 3. Never allowed\n\n3.1 Stolen goods, or goods you have any reason to believe are stolen, including items with a removed, scratched or altered serial number, and phones reported lost or stolen or locked to another person's account.\n\n3.2 Counterfeit goods, replicas, copies, \"first copy\", \"master copy\", \"grade A\", and anything that carries a brand it was not made under. Selling a fake is a crime in every country we operate in.\n\n3.3 Weapons and anything designed to injure: firearms, ammunition, parts, magazines, air guns, imitation firearms, tasers, knuckle dusters, swords and combat knives, batons, pepper spray, and body armour where it is restricted.\n\n3.4 Explosives, fireworks, flares, gunpowder, detonators.\n\n3.5 Narcotics, controlled substances, and anything used to take them or to make them, including scales sold for that purpose.\n\n3.6 Prescription medicines, veterinary medicines, injectables, and any medicine at all, opened or sealed, expired or in date.\n\n3.7 Medical devices that require a prescription or a licence, contact lenses including cosmetic lenses, hearing aids, dental appliances, and any used item that goes inside the body.\n\n3.8 Alcohol, alcohol production kits, and non alcoholic products presented as alcohol substitutes where local law forbids them.\n\n3.9 Tobacco, shisha tobacco, electronic cigarettes, vaping devices and liquids, and nicotine pouches.\n\n3.10 Pork and pork derived products.\n\n3.11 Gambling equipment, lottery tickets, betting devices and casino items.\n\n3.12 Antiquities, archaeological artefacts, coins and objects excavated from any site, and anything that may be cultural property. This applies with particular force in Iraq, Egypt, Jordan and Lebanon, where trading in antiquities is a serious criminal offence.\n\n3.13 Protected wildlife and anything made from it: ivory, rhino horn, coral, turtle shell, protected furs and skins, falcons and birds of prey, and any animal or plant listed as endangered.\n\n3.14 Live animals of any kind, and animal parts.\n\n3.15 Human remains, organs, blood, hair sold with human tissue, and bodily fluids.\n\n3.16 Government issued documents and anything that pretends to be one: identity cards, passports, driving licences, residence permits, vehicle registration books, certificates, diplomas, stamps and seals.\n\n3.17 Uniforms, badges, insignia and equipment of the police, the army, or any government body.\n\n3.18 SIM cards, registered mobile numbers, bank cards, e-wallets, and any account with a login, including social media accounts and game accounts.\n\n3.19 Surveillance and interception equipment: hidden cameras, spy devices, signal jammers, radar detectors, IMSI catchers, GPS trackers sold for covert use, and software for intercepting communications.\n\n3.20 Devices and cards sold to receive paid television or streaming without paying for it.\n\n3.21 Currency, cheques, financial instruments, gold or silver sold as an investment product, cryptocurrency, mining hardware sold with a promise of return, gift cards, vouchers and points.\n\n3.22 Personal data, contact lists, customer lists, copied documents, and anything containing another person's information.\n\n3.23 Pornographic and sexually explicit material, sex toys, and anything indecent.\n\n3.24 Material that insults a religion, promotes hatred, incites violence, or is prohibited as offensive to public order or public morals in the country of the listing.\n\n3.25 Recalled products, and any item under a manufacturer safety recall.\n\n3.26 A child car seat that has been in a collision, is past its expiry date, has an unknown history, or is missing its original safety parts.\n\n3.27 Expired safety equipment: fire extinguishers past service date, expired life jackets, expired helmets, expired smoke alarms.\n\n3.28 Airbags, seat belt pretensioners, and other pyrotechnic vehicle parts.\n\n3.29 Hazardous chemicals, pesticides, industrial solvents, mercury, asbestos and asbestos containing material, refrigerant gases, and lead paint.\n\n3.30 Used underwear, used swimwear, used socks, used cosmetics, opened perfume, opened skincare, used razors, used toothbrushes, and used piercing jewellery.\n\n3.31 Baby formula, food supplements, and any food that is opened, unlabelled, past its date, or requires refrigeration.\n\n3.32 Locksmithing and lock bypass tools, credit card skimmers, and tools whose main use is theft or fraud.\n\n3.33 Services of any kind, work, jobs, rentals, property, digital goods, downloads, software licences, subscriptions, and anything that is not a physical object handed over in person.\n\n3.34 Free items requested in exchange for a payment first, \"money multiplication\", and any listing that exists to move money rather than an object.\n\n3.35 Anything the law of the country of the listing forbids to sell, to own, to import, or to advertise.\n\n## 4. Allowed only with conditions\n\n4.1 **Mobile phones, tablets and computers.** You must state the model, the storage, and the condition. The device must not be locked to another person's account, must not be reported lost or stolen, and must have its original serial number intact. You must remove your accounts and wipe your data before handover.\n\n4.2 **Branded goods.** You must own the item, describe it honestly, and photograph the actual item. If you cannot show that a designer item is genuine, do not describe it as genuine. If we doubt it, we remove it.\n\n4.3 **Jewellery and precious metals.** State the metal, the weight, and whether there is a hallmark or a certificate. Do not describe stones as natural without evidence. Some countries require a licence to trade in gold as a business.\n\n4.4 **Vehicles, motorcycles and their parts.** You must be the registered owner or hold a written authority. State the mileage, the accident history, and any outstanding finance. Transfer of ownership follows the law of your country and is the responsibility of the two of you, not ours. Airbags are prohibited under clause 3.28.\n\n4.5 **Bicycles and electric scooters.** State the frame or serial number. We will remove a listing where the number has been removed.\n\n4.6 **Drones and radio controlled aircraft.** Only where the country permits private sale. Registration and licensing is the responsibility of the buyer and the seller.\n\n4.7 **Tools, machinery and power tools.** Must be complete with their guards and safety parts, and must work as described.\n\n4.8 **Knives.** Kitchen knives, work tools and camping equipment are allowed. Anything designed as a weapon is prohibited under clause 3.3.\n\n4.9 **Books, films, music and games.** Must not be pirated copies, and must not contain material prohibited under clause 3.24. Age rated items may only be sold to buyers of the right age.\n\n4.10 **Event tickets.** Only where the country and the organiser permit resale, only at or below face value, and never for a religious pilgrimage.\n\n4.11 **Sealed food and drink.** Only unopened, in date, correctly labelled, and not requiring refrigeration.\n\n4.12 **Clothing and shoes.** Must be clean and free from damage that is not described. See clause 3.30 for what may never be sold used.\n\n4.13 **Furniture and mattresses.** Must be clean and free of pests. State any stains, damage or repairs. Some countries restrict the resale of used mattresses.\n\n4.14 **Car seats for children, cots, prams and other child equipment.** See clause 5.\n\n4.15 **Electrical goods, chargers, batteries and power banks.** See clause 5.\n\n4.16 **Gas appliances, cylinders, heaters and water heaters.** Cylinders must be empty, in date, and undamaged. Some countries prohibit private resale entirely.\n\n4.17 **Helmets, life jackets and protective equipment.** Only where the item is in date, has never been in an impact, and is complete.\n\n4.18 **Antiques that are not antiquities.** Furniture, watches and household objects of age are allowed. Anything excavated, or of archaeological or religious significance, is prohibited under clause 3.12.\n\n## 5. Extra rules for items that can hurt someone\n\n5.1 If you list any of the following, you must state its age, whether it has been in an accident, whether it has been repaired, and whether it is complete: child car seats, cots, cot mattresses, prams, high chairs, baby carriers, stair gates, electrical appliances, cables, chargers, power banks, batteries, gas appliances, heaters, helmets, ladders, and power tools.\n\n5.2 A child car seat may only be listed if you are the original owner, you can state its date of manufacture, it is within its expiry date, it has never been in a collision, and it is complete with its original straps and base. Anything else is prohibited under clause 3.26.\n\n5.3 An electrical item must be complete, must not have exposed or repaired wiring, must have its original plug or a correct replacement, and must not be a counterfeit charger.\n\n5.4 A battery or power bank must not be swollen, punctured, dropped, or a counterfeit of a brand.\n\n5.5 If you buy one of these items, inspect it before you pay and check for a manufacturer recall. lelbe3 does not inspect items and does not check recalls.\n\n5.6 We may remove any listing in this clause without notice if we are not satisfied that it is safe. We do not have to explain what made us unsatisfied.\n\n## 6. Country differences\n\n6.1 This list is the minimum. Each country adds to it.\n\n6.2 The following country rules must be confirmed by a local lawyer before launch. Until they are, the strictest rule applies everywhere.\n\n| Country | Items needing a specific local rule |\n|---|---|\n| Iraq | Antiquities, weapons, communications equipment, currency |\n| Egypt | Antiquities, medicines, communications equipment, alcohol, currency |\n| Saudi Arabia | Alcohol, pork, religious material, media, weapons, communications equipment, gold trading |\n| United Arab Emirates | Alcohol, pork, media, drones, telecommunications equipment, e cigarettes |\n| Qatar | Alcohol, pork, media, drones, telecommunications equipment |\n| Oman | Alcohol, weapons, wildlife, media |\n| Bahrain | Alcohol, media, telecommunications equipment |\n| Jordan | Antiquities, weapons, medicines |\n| Lebanon | Antiquities, weapons, medicines, currency |\n| Kuwait | Alcohol, pork, media, weapons, telecommunications equipment |\n\n6.3 Where a country forbids an item that this list allows, the country rule wins and the listing is removed.\n\n## 7. What happens if you break this list\n\n7.1 The listing is removed.\n\n7.2 Depending on what it was, you may lose the ability to list, be suspended, or have your account closed permanently.\n\n7.3 For items in clauses 3.1, 3.2, 3.3, 3.5, 3.12, 3.13, 3.15, 3.16 and 3.19, we close the account immediately and, where the law requires it, we report it to the authorities and preserve the records.\n\n7.4 We do not refund, compensate, or restore listings removed under this document.\n\n7.5 You may appeal at [APPEALS CONTACT ADDRESS]. A human reviews appeals about account closure.\n\n## 8. Reporting a listing\n\n8.1 Use the report button on any listing, or write to [SAFETY CONTACT ADDRESS].\n\n8.2 If you believe an item is stolen, report it to the police first, then to us with the police reference. We will preserve the record and respond to a lawful request from the police.\n\n8.3 If you own a trademark and believe a listing is counterfeit, write to [IP CONTACT ADDRESS] with proof of the right.\n\n## 9. Changes and language\n\n9.1 We update this list as the law changes and as we learn. Every change produces a new version number and effective date.\n\n9.2 A change that adds a prohibition takes effect immediately for new listings, and existing listings of the newly prohibited item are removed.\n\n9.3 This document exists in Arabic and English, both at version 1.0, with identical clause numbers. The Arabic version governs.\n\n9.4 All numbers are written in Latin digits.\n"}}, {"id": "community-rules", "titleAr": "قواعد التعامل", "titleEn": "Community Rules", "version": "1.0", "status": "draft", "body": {"ar": "# قواعد المجتمع والسلامة\n\n> **مسودة قيد المراجعة القانونية.** لم تُراجَع هذه الوثيقة من محامٍ مرخّص في أي من دول التشغيل. ولنظام المخالفات وعقوبات الحسابات وإرشادات السلامة آثار قانونية توجب مراجعتها قبل النشر. راجع `LAWYER-BRIEF.md`.\n\n**معرّف الوثيقة:** `community-rules`\n**رقم الإصدار:** 1.0\n**تاريخ النفاذ:** [تاريخ النفاذ]\n**اللغتان:** العربية (`ar`) والإنجليزية (`en`)، وكلتاهما بالإصدار 1.0 وبترقيم بنود متطابق.\n**اللغة الحاكمة:** **العربية.** عند الاختلاف تُرجَّح النسخة العربية.\n\n---\n\n## 1. ماهية هذه القواعد\n\n1.1 هذه القواعد جزء من شروط الاستخدام، وتبيّن كيف يتعامل الناس على لِلبيع وماذا يحدث عند مخالفة ذلك.\n\n1.2 وهي قصيرة عن قصد، لأن لِلبيع يقوم على ثقة بين شخصين غريبين على وشك أن يلتقيا، وكل ما هنا وُضع ليمرّ ذلك اللقاء على خير.\n\n1.3 ولا يحتفظ لِلبيع بمالك ولا بالسلعة، فحرصك أنت هو حمايتك الأولى، وهذه القواعد وأدوات السلامة هي الثانية.\n\n## 2. خمسة أمور هي الأهم\n\n2.1 قل الحقيقة عن سلعتك.\n\n2.2 احضر في الموعد الذي حدّدته.\n\n2.3 ادفع ما اتفقتما عليه، نقداً، عند التسليم.\n\n2.4 لا ترسل مالاً قبل أن تكون السلعة في يدك.\n\n2.5 عامل الطرف الآخر كما تحب أن يُعامل أهلك.\n\n## 3. الصدق\n\n3.1 صِف السلعة كما هي بعيوبها، وصوّر السلعة ذاتها.\n\n3.2 لا تعلن سعراً لن تبيع به، ولا ترفع السعر بعد موافقة أحد عليه.\n\n3.3 لا تعرض سلعة سبق بيعها، ولا تُبقِ إعلاناً قائماً لجمع الرسائل.\n\n3.4 لا تستخدم صور شخص آخر ولا اسمه ولا هويته.\n\n3.5 لا تدّعِ شارة أو توثيقاً أو تقييماً لا تملكه.\n\n## 4. المراسلة\n\n4.1 قبل انعقاد الصفقة لا يمكنك إلا إرسال العبارات المحددة والعروض المنظّمة التي يوفّرها التطبيق. وهذا ليس خللاً، بل هو ما يزيل أغلب المضايقات وأغلب عمليات الاحتيال.\n\n4.2 وبعد الصفقة يمكنك الكتابة بحرية لترتيب التسليم، فاجعل الحديث عن السلعة.\n\n4.3 لا تطلب رقم هاتف ولا حساباً على وسائل التواصل ولا تطبيق محادثة قبل أن يوجد سبب للقاء، فالبائع الجاد والمشتري الجاد لا يحتاجان ذلك قبل أوانه.\n\n4.4 لا ترسل روابط. فالرابط الذي يرسله غريب في سوق إلكتروني احتيال في الغالب الأعم.\n\n4.5 الرسائل تُفحص آلياً، وقد تُحجب بعضها أو تتأخر. وإن حُجبت رسالة مشروعة أرسلتها فأبلغنا لننظر فيها.\n\n4.6 لا ترسل الرسالة ذاتها لعدد كبير من الناس، ولا تستخدم لِلبيع للإعلان عن شيء غير السلعة موضوع الإعلان.\n\n## 5. اللقاء والتسليم\n\n5.1 التقِ في مكان عام فيه ناس وإضاءة جيدة: مركز تسوق، أو محطة وقود، أو مقهى، أو ساحة مركز شرطة حيث يتاح ذلك.\n\n5.2 أخبر شخصاً تثق به بوجهتك وبموعد عودتك المتوقع.\n\n5.3 اصطحب معك أحداً عند التعامل بسلعة كبيرة أو غالية.\n\n5.4 لا تذهب إلى منزل خاص إن لم ترتح لذلك، ولا تدخل غريباً إلى منزلك وأنت وحدك أبداً.\n\n5.5 افحص السلعة فحصاً كاملاً قبل الدفع: شغّلها، وتحقق من رقمها التسلسلي، وانظر ما الناقص فيها.\n\n5.6 وإن شعرت بشيء غير مطمئن فانصرف. لا سلعة تستحق ذلك، ولن تخسر شيئاً على لِلبيع بانصرافك.\n\n5.7 عُدّا المال أمام بعضكما، وتحققا من الأوراق الكبيرة.\n\n5.8 أكّد التسليم في التطبيق فور إتمامه، فذلك ما يفتح التقييم وما يجعل عدم الحضور قابلاً للإثبات.\n\n5.9 ولِلبيع لا يحضر عمليات التسليم ولا يشرف عليها ولا يستطيع مساعدتك أثناءها. وفي حالة الطوارئ اتصل بالشرطة لا بنا.\n\n## 6. المال\n\n6.1 الدفع على لِلبيع نقداً وحضورياً عند التسليم.\n\n6.2 **لا ترسل مالاً مقدماً أبداً:** لا عربوناً ولا رسم حجز ولا أجرة توصيل ولا جمارك ولا \"إثباتاً لجديتك\" ولا إلى قريب أو صديق للطرف الآخر ولا إلى صرّاف.\n\n6.3 ولن نطلب منك مالاً ولا رقم بطاقة ولا حوالة مصرفية ولا رمز تحقق. وكل من يطلب ذلك فليس نحن.\n\n6.4 ولا تشارك رمز التحقق الذي يصل إلى هاتفك، فمن يطلبه يحاول الاستيلاء على حسابك.\n\n6.5 ولا تقبل دفعة تصل قبل اللقاء بأي صورة، فهي أكثر الطرق شيوعاً في تحريك الأموال المسروقة.\n\n6.6 وإن طُلب منك الدفع مقدماً فأبلغ عنه. فهذا السلوك وحده أوضح إشارة على الاحتيال في هذه الخدمة.\n\n## 7. المزادات والمزايدات\n\n7.1 المزايدة التزام بالشراء بذلك السعر وبحضور التسليم.\n\n7.2 لا تزايد لاختبار سعر ولا لمنع مشترٍ آخر ولا لرفع سعر لصديق.\n\n7.3 والبائع الذي يقيم مزاداً ملزم بالبيع لمن رست عليه بسعر الرسو.\n\n7.4 ورسو المزايدة ثم عدم الحضور، أو رسوّها ثم رفض الدفع، يستوجب مخالفة، وكذلك إقامة مزاد ثم رفض البيع.\n\n## 8. التقييمات\n\n8.1 قيّم بصدق على المحاور الخمسة بعد كل صفقة.\n\n8.2 والتقييم مزدوج التعمية، فلن ترى تقييم الطرف الآخر حتى تقدّما معاً أو تنتهي المهلة. فقيّم ما حدث لا ما تتوقع أن تناله.\n\n8.3 ولا تهدد بتقييم منخفض لنيل خصم أو إضافة، فذلك ابتزاز يُغلق الحسابات.\n\n8.4 ولا تتفق على تبادل تقييمات مرتفعة، ولا تقيّم صفقة لم تقع.\n\n8.5 ولا توجد تعليقات مكتوبة على لِلبيع في أي موضع، وهذا مقصود، فلا تحاول كتابة تعليق عبر اسمك الظاهر أو عنوان إعلان.\n\n## 9. الاحترام\n\n9.1 لا سبّ ولا تهديد ولا ترهيب ولا ملاحقة لأحد بعد الصفقة.\n\n9.2 ولا رسائل ذات طابع جنسي ولا تعليق على مظهر أحد ولا تواصل لغرض غير السلعة.\n\n9.3 ولا تمييز على أساس الجنسية أو الدين أو المذهب أو الجنس أو القبيلة أو الأصل أو أي أساس آخر، لا في إعلان ولا في رسالة ولا في اختيار من تتعامل معه.\n\n9.4 ولا نشر لمعلومات أحد الشخصية: رقم هاتف أو عنوان أو صورة شخص أو وثيقة هوية أو لوحة مركبة أو لقطة شاشة لمحادثة خاصة.\n\n9.5 وما لا تقوله في وجه صاحبه فلا ترسله.\n\n## 10. علامات الاحتيال\n\n10.1 يريد الدفع قبل اللقاء، أو يريدك أن تدفع قبل اللقاء.\n\n10.2 يقول إنه في مدينة أخرى أو دولة أخرى ويعرض \"ترتيب التوصيل\".\n\n10.3 يرسل رابطاً لإتمام الصفقة أو تأكيد عنوان أو استلام دفعة.\n\n10.4 يطلب الرمز الذي وصل إلى هاتفك.\n\n10.5 السعر أقل بكثير من السوق، مع استعجال.\n\n10.6 يريد الانتقال فوراً إلى تطبيق آخر قبل الحديث عن السلعة أصلاً.\n\n10.7 يرسل لقطة شاشة لحوالة كدليل، ويطلب تسليم السلعة قبل أن يصل المال إلى يدك.\n\n10.8 يطلب منك استلام طرد أو مبلغ لحساب شخص آخر، وهذا غسل أموال وهو جريمة.\n\n10.9 وأي واحدة من هذه العلامات وحدها سبب كافٍ للتوقف والإبلاغ.\n\n## 11. المخالفات\n\n11.1 تُسجَّل المخالفة على الحساب عند ثبوت خرق هذه القواعد.\n\n11.2 وتُسجَّل عند: ثبوت عدم الحضور لتسليم اتفقت عليه، ورسو مزايدة مع رفض دفع قيمتها، ورفض البيع لمن رست عليه المزايدة، وتكرار إلغاء الصفقات، وأنماط رسائل محجوبة، وثبوت مخالفة وصف السلعة للواقع.\n\n11.3 **وثلاث مخالفات تُسقط حق المزايدة،** وما زاد يوقف حق النشر ثم يغلق الحساب.\n\n11.4 ولا تُسجَّل المخالفة إلا بعد إتاحة الفرصة للطرفين لبيان ما جرى، ما لم يكن في الانتظار خطر على السلامة.\n\n11.5 وتسقط المخالفات بعد [12] شهراً من السلوك السليم، عدا مخالفات السلامة والاحتيال والسلع الممنوعة فلا تسقط.\n\n11.6 ويمكنك الاطلاع على مخالفاتك والتظلم منها في التطبيق.\n\n## 12. ما نفعله عند المخالفة\n\n12.1 بحسب الواقعة، وبهذا الترتيب تقريباً: تنبيه، ثم إزالة إعلان، ثم فقدان ميزة كالمزايدة أو المراسلة، ثم إيقاف مؤقت، ثم إغلاق نهائي للحساب، ثم الإبلاغ للجهات المختصة مع حفظ السجلات حيث يُحتمل وقوع جريمة.\n\n12.2 وننتقل مباشرة إلى الإغلاق النهائي دون تنبيه في: الاحتيال، والسلع المسروقة، والسلع المقلّدة، والأسلحة، والمخدرات، والآثار، والتهديد بالعنف، والتحرش، وكل ما يتعلق بطفل، وأي محاولة للاستيلاء على حساب شخص آخر.\n\n12.3 وقد نتصرف بناءً على نمط سلوك ولو لم يكن فعل واحد منه كافياً بذاته.\n\n12.4 ونحن من يقرر ما ننشره ومن نخدمه. وإزالة إعلان أو إغلاق حساب ليس حكماً قانونياً عليك ولا فصلاً في أي نزاع بينك وبين مستخدم آخر.\n\n## 13. التظلم\n\n13.1 يمكنك التظلم من أي قرار إنفاذ عبر التطبيق أو على [عنوان التظلمات].\n\n13.2 ويبتّ في تظلم إغلاق الحساب موظف بشري لا نظام آلي.\n\n13.3 ونبيّن لك السبب، ما لم يكن في بيانه إعانة على احتيال أو كشف لشخص في خطر أو مخالفة للقانون.\n\n13.4 ونسعى للرد على التظلم خلال [14] يوماً.\n\n## 14. الإبلاغ\n\n14.1 أبلغ عن إعلان أو رسالة أو مستخدم بزر الإبلاغ، أو راسلنا على [عنوان السلامة].\n\n14.2 وأبلغ الشرطة أولاً عن أي جريمة، ومنها السرقة والسلعة المسروقة والتهديد والاعتداء والاحتيال الذي خسرت فيه مالاً، ثم أبلغنا برقم البلاغ، فنحفظ السجل ونستجيب لأي طلب مشروع من الشرطة.\n\n14.3 وإن كنت في خطر داهم فاتصل برقم الطوارئ في دولتك. فلِلبيع ليس لديه خط طوارئ ولا يستطيع الوصول إليك.\n\n14.4 ونحمي هوية من يبلّغ بحسن نية. أما الإبلاغ الكاذب المتكرر فهو بذاته مخالفة لهذه القواعد.\n\n## 15. اللغة\n\n15.1 تصدر هذه الوثيقة بالعربية والإنجليزية، وكلتاهما بالإصدار 1.0 وبترقيم بنود متطابق، والنسخة العربية هي الحاكمة.\n\n15.2 وتُكتب جميع الأرقام بالأرقام اللاتينية.\n", "en": "# Community and Safety Rules\n\n> **DRAFT, PENDING LEGAL REVIEW.** This document has not been reviewed by a qualified lawyer in any operating country. The strike system, the account penalties and the safety guidance all have legal consequences and must be reviewed before publication. See `LAWYER-BRIEF.md`.\n\n**Document id:** `community-rules`\n**Version:** 1.0\n**Effective date:** [EFFECTIVE DATE]\n**Languages:** Arabic (`ar`) and English (`en`). Both versions carry version 1.0 and identical clause numbering.\n**Governing language:** **Arabic.** If the two versions differ, the Arabic version prevails.\n\n---\n\n## 1. What these rules are\n\n1.1 These rules are part of the Terms of Use. They describe how people behave on lelbe3 and what happens when they do not.\n\n1.2 They are short on purpose. lelbe3 works on trust between two strangers who are about to meet in person. Everything here exists to make that meeting go well.\n\n1.3 lelbe3 does not hold your money and does not hold the item. Your own care is your main protection. These rules and the safety features are the second.\n\n## 2. The five things that matter most\n\n2.1 Say what is true about your item.\n\n2.2 Turn up when you say you will.\n\n2.3 Pay what you agreed, in cash, at the handover.\n\n2.4 Never send money before you have the item in your hands.\n\n2.5 Treat the other person the way you would want your family treated.\n\n## 3. Honesty\n\n3.1 Describe the item as it is, including faults. Photograph the actual item.\n\n3.2 Do not advertise a price you will not sell at, and do not raise the price after someone agrees to it.\n\n3.3 Do not list an item that is already sold, and do not keep a listing alive to collect messages.\n\n3.4 Do not use another person's photographs, name, or identity.\n\n3.5 Do not claim a badge, a verification, or a rating you do not have.\n\n## 4. Messaging\n\n4.1 Before a deal exists you can only send the fixed phrases and structured offers the app provides. This is not a bug. It removes most harassment and most scams.\n\n4.2 After a deal you can write freely to arrange the handover. Keep it about the item.\n\n4.3 Do not ask for a phone number, a social media account, or a chat application before there is a reason to meet. Genuine buyers and sellers do not need it earlier.\n\n4.4 Do not send links. A link sent by a stranger on a marketplace is almost always a fraud.\n\n4.5 Messages are screened automatically. Some messages will be blocked or delayed. If a message you sent was legitimate and was blocked, tell us and we will look at it.\n\n4.6 Do not send the same message to many people, and do not use lelbe3 to advertise anything other than the item in the listing.\n\n## 5. Meeting and handover\n\n5.1 Meet in a public place with people around and good light: a mall, a petrol station forecourt, a coffee shop, a police station car park where one is available.\n\n5.2 Tell someone you trust where you are going and when you expect to be back.\n\n5.3 Take someone with you for a large or expensive item.\n\n5.4 Do not go to a private home if you are not comfortable, and never invite a stranger into yours when you are alone.\n\n5.5 Inspect the item completely before you pay. Turn it on. Check the serial number. Check what is missing.\n\n5.6 If anything feels wrong, walk away. No item is worth it. You will not lose anything on lelbe3 by leaving.\n\n5.7 Count the money in front of each other. Check large notes.\n\n5.8 Confirm the handover in the app once it is done. That is what opens the rating and what makes a no show provable.\n\n5.9 lelbe3 does not attend handovers, does not supervise them, and cannot help you at one. In an emergency call the police, not us.\n\n## 6. Money\n\n6.1 Payment on lelbe3 is cash, in person, at the handover.\n\n6.2 **Never send money in advance.** Not a deposit, not a reservation fee, not a delivery fee, not customs, not \"to prove you are serious\", not to a friend or relative of the other person, and not to an exchange office.\n\n6.3 We will never ask you for money, for a card number, for a bank transfer, or for a one time code. Anyone who does is not us.\n\n6.4 Never share the one time code sent to your phone. Anyone asking for it is trying to take your account.\n\n6.5 Do not accept a payment that arrives before you meet, in any form. It is the most common way stolen money is moved.\n\n6.6 If you are asked to pay in advance, report it. That single behaviour is the clearest signal of fraud on this service.\n\n## 7. Auctions and bids\n\n7.1 A bid is a commitment to buy at that price and to attend the handover.\n\n7.2 Do not bid to test a price, to block another buyer, or to raise a friend's price.\n\n7.3 A seller who runs an auction must sell to the winner at the winning price.\n\n7.4 Winning and not turning up, or winning and refusing to pay, earns a strike. So does running an auction and refusing to sell.\n\n## 8. Ratings\n\n8.1 Rate honestly, on the five pillars, after every deal.\n\n8.2 Ratings are double blind. You will not see the other person's rating until you both submit or the window closes. Rate what happened, not what you expect to receive.\n\n8.3 Do not threaten a low rating to get a discount or an extra. That is extortion and it closes accounts.\n\n8.4 Do not agree to swap high ratings, and do not rate a deal that did not happen.\n\n8.5 There is no written feedback on lelbe3, anywhere, by design. Do not try to leave one through your display name or a listing title.\n\n## 9. Respect\n\n9.1 No insults, threats, intimidation, or following someone after a deal.\n\n9.2 No sexual messages, no comments on someone's appearance, and no contact for any purpose other than the item.\n\n9.3 No discrimination on nationality, religion, sect, gender, tribe, origin, or any other ground, in a listing, in a message, or in who you will deal with.\n\n9.4 No publishing anyone's personal information: a phone number, an address, a photograph of a person, an identity document, a car plate, or a screenshot of a private conversation.\n\n9.5 If you would not say it standing in front of the person, do not send it.\n\n## 10. Signs of a scam\n\n10.1 They want to pay before meeting, or want you to pay before meeting.\n\n10.2 They are in another city or another country and offer to \"arrange delivery\".\n\n10.3 They send a link to complete the deal, confirm an address, or receive a payment.\n\n10.4 They ask for the code that arrived on your phone.\n\n10.5 The price is far below the market, and there is urgency.\n\n10.6 They want to move to another application immediately, before the item is discussed.\n\n10.7 They send a screenshot of a transfer as proof, and ask you to hand over the item before the money is in your hand.\n\n10.8 They ask you to receive a package or a payment for someone else. That is money laundering and it is a crime.\n\n10.9 Any of these, on their own, is enough reason to stop and report.\n\n## 11. Strikes\n\n11.1 A strike is recorded against an account for a confirmed breach of these rules.\n\n11.2 Strikes are given for: confirmed no show at a handover you agreed to, winning a bid and refusing to pay the bid amount, refusing to sell to an auction winner, repeated cancelled deals, blocked message patterns, and confirmed misdescription of an item.\n\n11.3 **Three strikes remove the ability to bid.** Further strikes suspend the ability to list and then close the account.\n\n11.4 A strike is recorded only after both sides have had the chance to say what happened, unless there is a safety risk in waiting.\n\n11.5 Strikes expire after [12] months of clean behaviour, except strikes for safety, fraud, or prohibited items, which do not expire.\n\n11.6 You can see your own strikes and appeal them in the app.\n\n## 12. What we do when rules are broken\n\n12.1 Depending on what happened, in roughly this order: a warning, removal of a listing, loss of a feature such as bidding or messaging, temporary suspension, permanent closure of the account, and where a crime may have been committed, a report to the authorities with the records preserved.\n\n12.2 We move straight to permanent closure, with no warning, for: fraud, stolen goods, counterfeit goods, weapons, drugs, antiquities, threats of violence, sexual harassment, anything involving a child, and any attempt to take another person's account.\n\n12.3 We may act on a pattern of behaviour even when no single act would be enough by itself.\n\n12.4 We decide what to publish and who to serve. Removing a listing or closing an account is not a legal finding against you and is not a decision on any dispute you have with another user.\n\n## 13. Appeals\n\n13.1 You can appeal any enforcement decision in the app, or at [APPEALS CONTACT ADDRESS].\n\n13.2 A human, not an automated system, decides an appeal about an account closure.\n\n13.3 We will tell you the reason unless telling you would help someone commit fraud, would identify a person at risk, or would break the law.\n\n13.4 We aim to answer an appeal within [14] days.\n\n## 14. Reporting\n\n14.1 Report a listing, a message or a user with the report button, or write to [SAFETY CONTACT ADDRESS].\n\n14.2 Report a crime to the police first. That includes theft, a stolen item, threats, assault, and fraud where you lost money. Then tell us, with the police reference, and we will preserve the record and answer a lawful request from the police.\n\n14.3 If you are in immediate danger, call the emergency number in your country. lelbe3 has no emergency line and cannot reach you.\n\n14.4 We protect the identity of a person who reports in good faith. Reporting falsely and repeatedly is itself a breach of these rules.\n\n## 15. Language\n\n15.1 This document exists in Arabic and English, both at version 1.0, with identical clause numbers. The Arabic version governs.\n\n15.2 All numbers are written in Latin digits.\n"}}, {"id": "seller-terms", "titleAr": "شروط البيع", "titleEn": "Seller Terms", "version": "1.0", "status": "draft", "body": {"ar": "# شروط البائع\n\n> **مسودة قيد المراجعة القانونية.** لم تُراجَع هذه الوثيقة من محامٍ مرخّص في أي من دول التشغيل. والبند 9 على وجه الخصوص يمسّ حقوقاً للمستهلك لا يجوز استبعادها في عدد من هذه الدول. راجع القسمين 4 و7 من `LAWYER-BRIEF.md`.\n\n**معرّف الوثيقة:** `seller-terms`\n**رقم الإصدار:** 1.0\n**تاريخ النفاذ:** [تاريخ النفاذ]\n**اللغتان:** العربية (`ar`) والإنجليزية (`en`)، وكلتاهما بالإصدار 1.0 وبترقيم بنود متطابق.\n**اللغة الحاكمة:** **العربية.** عند الاختلاف تُرجَّح النسخة العربية.\n\n---\n\n## 1. ماهية هذه الشروط\n\n1.1 تسري شروط البائع عليك في كل مرة تنشر فيها إعلاناً على لِلبيع، وهي جزء من شروط الاستخدام.\n\n1.2 وفي لِلبيع الحسابات كلها من نوع واحد: تكون بائعاً حين تعرض شيئاً، ومشترياً حين تشتري. وهذه الشروط تخص جانب البيع.\n\n1.3 وإذا كنت تبيع بانتظام أو بكميات أو بقصد الربح، فقد يعدّك قانون دولتك تاجراً وتترتب عليك التزامات أثقل. راجع البند 12.\n\n## 2. أنت البائع ولسنا نحن\n\n2.1 أنت تبيع سلعتك للمشتري مباشرة، ولِلبيع يعرّف بينكما ولا شيء غير ذلك.\n\n2.2 ولا نحوز سلعتك ولا نفحصها ولا نوصّلها ولا نستلم ثمنها. فالمشتري يدفع لك نقداً في يدك عند التسليم.\n\n2.3 وعقد البيع بينك وبين المشتري، ولسنا طرفاً فيه ولا وكيلاً عنك ولا ضامناً لك.\n\n2.4 ويعني ذلك أن التزامات البائع في قانون دولتك تقع عليك لا علينا. وإذا كان للمشتري ادعاء قانوني بشأن السلعة فهو ادعاء قِبَلك أنت.\n\n## 3. ما تقرّ به عن كل سلعة تعرضها\n\n3.1 أنك مالك السلعة أو مفوّض كتابةً ببيعها.\n\n3.2 وأنك حائز للسلعة فعلياً وقت نشر الإعلان.\n\n3.3 وأن السلعة ليست مسروقة وليس لديك ما يدعو للاعتقاد بذلك.\n\n3.4 وأن السلعة أصلية، غير مقلّدة، وليست نسخة تُباع على أنها أصلية، ولا تحمل علامة لم تُصنع تحتها.\n\n3.5 وأن بيعها وحيازتها والإعلان عنها مشروع في دولة نشر الإعلان، وأنها ليست في قائمة السلع الممنوعة والمقيّدة.\n\n3.6 وأن الوصف والصور صحيحة، وأنها للسلعة ذاتها التي ستسلّمها.\n\n3.7 وأنك أفصحت عن كل عيب وتلف وإصلاح ونقص تعلمه.\n\n3.8 وأن السلعة غير خاضعة لسحب سلامة من الشركة الصانعة وغير منتهية الصلاحية.\n\n3.9 وأنك أزلت بياناتك الشخصية من السلعة، بما فيها الحسابات والصور والملفات وشرائح الاتصال وبطاقات الذاكرة.\n\n3.10 وهذه الإقرارات مقدَّمة للمشتري ولنا، ومخالفتها إخلال بهذه الشروط وقد تكون مخالفة للقانون كذلك.\n\n## 4. إعلانك\n\n4.1 صوّر السلعة ذاتها بنفسك في إضاءة جيدة ومن أكثر من زاوية، مع تصوير العيوب.\n\n4.2 ولا تستخدم صورة من الإنترنت ولا من الشركة الصانعة ولا من إعلان آخر.\n\n4.3 واكتب عنواناً يصف السلعة لا شعاراً، ولا تحشوه بكلمات لتظهر في بحث أوسع.\n\n4.4 وضع السلعة في فئتها الصحيحة. وإذا استكملت أنظمتنا الآلية فئة أو علامة أو طرازاً أو حالة من صورتك وعنوانك فراجعها، فالإعلان إعلانك والمسؤولية مسؤوليتك.\n\n4.5 ولا تضع في الإعلان رقم هاتف ولا عنواناً ولا رابطاً ولا حساب تواصل ولا بريداً إلكترونياً.\n\n4.6 وإعلان واحد لكل سلعة، ولا تعِد نشر السلعة ذاتها مراراً لتبدو جديدة.\n\n4.7 وحدّث الإعلان أو أغلقه فور بيع السلعة أو تعذّر توفيرها.\n\n## 5. السعر\n\n5.1 السعر المنشور هو السعر الذي تعرض البيع به.\n\n5.2 ولا ترفع السعر بعد قبول مشترٍ له، ولا تنشر سعراً منخفضاً لجذب الرسائل ثم تعرض سلعة أخرى.\n\n5.3 وأي نطاق سعري أو سعر مقترح أو تقدير يعرضه لِلبيع هو تقدير آلي وليس تقييماً، وتحديد السعر قرارك ومسؤوليتك.\n\n5.4 ويمكنك التفاوض عبر مسار العرض المنظّم، ومتى قبلت عرضاً فقد التزمت بالبيع بذلك السعر.\n\n## 6. الهوية والحدود المالية\n\n6.1 يكفي رقم هاتف موثّق لعرض السلع دون الحد المالي المنشور في التطبيق لدولتك.\n\n6.2 ولعرض سلعة تبلغ ذلك الحد أو تتجاوزه، يلزم إتمام التحقق من الهوية الرسمية.\n\n6.3 ولإقامة مزاد، يلزم إتمام التحقق من الهوية الرسمية.\n\n6.4 ويجوز لنا مطالبتك بإعادة التحقق وإخفاء إعلاناتك إلى حين إتمامه.\n\n6.5 ولا تحاول تجاوز الحد بتجزئة السلعة أو ببخس السعر أو بنقل الصفقة خارج لِلبيع.\n\n## 7. إذا أقمت مزاداً\n\n7.1 أنت تحدد سعر البداية ووقت الانتهاء، والمزايدون حسابات موثّقة ومزايداتهم التزام.\n\n7.2 **وعليك البيع لصاحب أعلى مزايدة بسعر الرسو،** والامتناع يستوجب مخالفة وقد يُغلق حسابك.\n\n7.3 ولا يجوز أن تزايد على سلعتك ولا أن ترتّب مع غيرك للمزايدة عليها لرفع سعرها، وذلك يغلق الحساب فوراً.\n\n7.4 ولا يجوز إلغاء مزاد هرباً من سعر لم يعجبك. وقد نسمح بالإلغاء لسبب حقيقي، كتلف السلعة أو سرقتها قبل انتهاء المزاد.\n\n7.5 وحيث تشترط دولة ترخيصاً للمزادات، فلن تكون المزادات متاحة فيها. راجع الملحق (أ) من شروط الاستخدام.\n\n## 8. التسليم\n\n8.1 احضر في الزمان والمكان المتفق عليهما، أو أخبر المشتري في أبكر وقت ممكن بتعذّر ذلك.\n\n8.2 وسلّم السلعة المعروضة بالحالة التي وصفتها ومكتملة بكل ما ذكرت أنه معها.\n\n8.3 وأتح للمشتري فحص السلعة وتجربتها قبل الدفع، فالمشتري الذي يُمنع من الفحص سينصرف، وحقه أن ينصرف.\n\n8.4 واستلم المبلغ نقداً وعُدّه أمام المشتري وتحقق من الأوراق الكبيرة.\n\n8.5 ولا تقبل دفعة مقدمة ولا حوالة ولا لقطة شاشة لحوالة ولا شيكاً ولا دفعة من غير المشتري.\n\n8.6 وأكّد التسليم في التطبيق، فذلك ما يفتح التقييمات وما يثبت وقوع الصفقة.\n\n8.7 وثبوت عدم الحضور يستوجب مخالفة. راجع قواعد المجتمع والسلامة.\n\n## 9. ما بعد البيع\n\n9.1 بيع السلعة المستعملة بين شخصين يكون في الأصل باتاً متى فحص المشتري السلعة ودفع ثمنها، وهذا هو المتعارف عليه في لِلبيع.\n\n9.2 **غير أن البند 9.1 لا يعلو على القانون.** ففي عدد من الدول التي يعمل فيها لِلبيع يحتفظ المشتري بحقوق لا يجوز للبائع الاتفاق على استبعادها، ولا سيما عند مخالفة الوصف للواقع، أو إخفاء عيب، أو كون السلعة غير صالحة للاستعمال أصلاً، أو كون البائع تاجراً في حقيقة الأمر. وحيث يمنح قانون دولة التسليم المشتري حقاً من هذا القبيل، سرى ذلك الحق ولم يُسقطه البند 9.1.\n\n9.3 وإذا أخفيت عيباً أو خالف وصفك الواقع أو بعت ما لا يجوز لك بيعه، فتلك مشكلتك أنت لا مشكلة المشتري، ولن ندافع عنك وسنتصرف بمقتضى البلاغ.\n\n9.4 ويجوز لك تقديم شروط إرجاع أو ضمان خاصة بك عند التسليم، فإن فعلت فالتزم بها. ونحن لا ننفّذها ولسنا طرفاً فيها.\n\n9.5 ولا يستطيع لِلبيع إلغاء دفعة ولا استرداد سلعة ولا الأمر بردّ الثمن. فلا يوجد حساب ضمان.\n\n## 10. السلع الحرجة للسلامة\n\n10.1 إذا عرضت مقعد سيارة لطفل أو سريراً أو عربة أو جهازاً كهربائياً أو بطارية أو جهاز غاز أو مدفأة أو خوذة أو سلّماً أو عدة كهربائية، سرى عليك البند 5 من قائمة السلع الممنوعة والمقيّدة بكامله.\n\n10.2 وعليك بيان عمر السلعة وتاريخ حوادثها وإصلاحاتها وما إذا كانت مكتملة بأجزاء السلامة الأصلية.\n\n10.3 وبعض هذه السلع لا يجوز بيعها على لِلبيع إطلاقاً، ومنها مقعد سيارة لطفل تعرّض لاصطدام أو تجاوز صلاحيته، وأي منتج مسحوب من السوق.\n\n10.4 وبيع أداة سلامة مستعملة تؤذي أحداً قد تترتب عليه مسؤولية جزائية ومدنية في كل دولة نعمل فيها. فلا تخاطر، وإن لم تكن على يقين من تاريخ السلعة فلا تعرضها.\n\n## 11. ممنوعات على البائع\n\n11.1 نقل التعامل خارج لِلبيع مع مشترٍ التقيته على لِلبيع بقصد التحايل على قواعدنا أو فحصنا أو سجلاتنا. ولك بالطبع أن تلتقي وتتعامل حضورياً، والممنوع هو نقل المحادثة خارج الخدمة تهرباً من قواعد السلامة.\n\n11.2 طلب دفعة مقدمة أو قبولها.\n\n11.3 مطالبة المشتري برمز تحقق أو رقم بطاقة أو حوالة مصرفية أو وثيقة هويته.\n\n11.4 استخدام رقم المشتري أو عنوانه أو صوره لغير غرض الصفقة، أو إضافته إلى قائمة تسويقية.\n\n11.5 عرض سلعة مباعة أصلاً، أو إبقاء إعلان لا تنوي إتمامه.\n\n11.6 التلاعب بالتقييمات أو المزايدات أو ترتيب البحث أو نظام المخالفات.\n\n11.7 تشغيل أكثر من حساب، أو العودة بعد الإغلاق برقم جديد.\n\n11.8 الإعلان عن خدمة أو وظيفة أو إيجار أو عقار أو أي شيء ليس سلعة مادية مستعملة.\n\n## 12. إذا كنت تاجراً\n\n12.1 عليك إخبارنا إن كنت تبيع بصفة تاجر، ويجوز لنا معاملة حسابك معاملة الحساب التجاري بناءً على نشاطه.\n\n12.2 والبائع التاجر يتحمل كامل أحكام قانون حماية المستهلك في دولة البيع، وهي تشمل عادةً واجبات في الوصف وعرض السعر والضمان والسلع المعيبة والفواتير، وفي بعض الدول حقاً للمشتري في إرجاع السلعة. وهذه الواجبات تخصك أنت.\n\n12.3 وعليك استخراج ما تشترطه دولتك من سجل تجاري أو ترخيص أو تسجيل ضريبي.\n\n12.4 ويجوز لنا مطالبتك بإثبات القيد وإيقاف إعلاناتك حتى تقدّمه.\n\n12.5 ولِلبيع مصمم للأفراد الذين يبيعون أشياءهم المستعملة، ويجوز لنا الامتناع عن خدمة البائع التاجر.\n\n## 13. الضريبة\n\n13.1 كل ضريبة تنشأ عن مبيعاتك أنت من يقرّ بها ويؤديها.\n\n13.2 ولا نحجز ضريبة ولا نصدر فواتير ضريبية عن مبيعاتك ولا نبلّغ عنها أي جهة ضريبية ما لم يوجب القانون ذلك.\n\n## 14. محتواك\n\n14.1 تبقى ملكية صورك وأوصافك لك، وتمنحنا الترخيص الوارد في البند 13 من شروط الاستخدام لعرض إعلانك والترويج له.\n\n14.2 وتقرّ بأنك التقطت الصور أو تملك حق استخدامها.\n\n## 15. متى نزيل إعلانك أو نغلق حسابك\n\n15.1 يجوز لنا إزالة إعلان أو إخفاؤه من البحث أو تقييد ميزة أو إغلاق حسابك متى قامت لدينا أسباب معقولة للاعتقاد بمخالفة هذه الشروط أو القانون، أو عند وجود خطر على المشترين.\n\n15.2 ونفعل ذلك دون إخطار حيث تكون السلعة ممنوعة أو غير آمنة أو مسروقة أو مقلّدة، أو حيث يعرّض الانتظار أحداً للخطر.\n\n15.3 ولا نعوّضك عن إعلان مُزال ولا عن مبيعات فائتة ولا عن ترتيب مفقود ولا عن حساب مغلق.\n\n15.4 ولك التظلم على [عنوان التظلمات]، ويبتّ موظف بشري في تظلمات إغلاق الحساب.\n\n## 16. مسؤوليتك تجاهنا\n\n16.1 إذا رفع مشترٍ أو جهة رسمية أو مالك علامة تجارية أو أي شخص آخر مطالبة ضد لِلبيع بسبب ما بعته أو عرضته، وكانت المطالبة ناشئة عن إخلالك بهذه الشروط أو بالقانون، تحمّلت خسائرنا المعقولة وأتعابنا القانونية.\n\n16.2 ولا يسري ذلك بقدر ما تكون المطالبة ناشئة عن فعلنا أو امتناعنا، ولا يسري حيث لا يجيز قانون دولتك اشتراط تعويض من هذا النوع على المستهلك.\n\n## 17. الرسوم\n\n17.1 البيع على لِلبيع مجاني اليوم: لا رسم نشر ولا عمولة على ثمن البيع.\n\n17.2 وإذا طرحنا تمييزاً مدفوعاً فسيكون اختيارياً ومعلوم السعر قبل الشراء.\n\n17.3 وإذا استحدثنا يوماً رسماً إلزامياً أو عمولة، نشرنا إصداراً جديداً من هذه الشروط وطلبنا قبولك له قبل سريانه عليك.\n\n## 18. التعديل واللغة\n\n18.1 كل تعديل لهذه الشروط يُنتج رقم إصدار وتاريخ نفاذ جديدين، والتعديل الجوهري يستلزم قبولك قبل سريانه عليك.\n\n18.2 وتصدر هذه الوثيقة بالعربية والإنجليزية، وكلتاهما بالإصدار 1.0 وبترقيم بنود متطابق، والنسخة العربية هي الحاكمة.\n\n18.3 وتُكتب جميع الأرقام بالأرقام اللاتينية.\n", "en": "# Seller Terms\n\n> **DRAFT, PENDING LEGAL REVIEW.** This document has not been reviewed by a qualified lawyer in any operating country. Clause 9 in particular touches consumer rights that cannot be excluded in several of these countries. See `LAWYER-BRIEF.md` sections 4 and 7.\n\n**Document id:** `seller-terms`\n**Version:** 1.0\n**Effective date:** [EFFECTIVE DATE]\n**Languages:** Arabic (`ar`) and English (`en`). Both versions carry version 1.0 and identical clause numbering.\n**Governing language:** **Arabic.** If the two versions differ, the Arabic version prevails.\n\n---\n\n## 1. What these terms are\n\n1.1 These Seller Terms apply to you every time you publish a listing on lelbe3. They are part of the Terms of Use.\n\n1.2 On lelbe3 everyone is the same kind of account. You are a seller when you list something, and a buyer when you buy something. These terms apply to the selling part.\n\n1.3 If you sell regularly, in volume, or for profit, the law of your country may treat you as a business, with heavier obligations. See clause 12.\n\n## 2. You are the seller, we are not\n\n2.1 You sell your item to the buyer directly. lelbe3 introduces you and nothing more.\n\n2.2 We never hold your item, never inspect it, never deliver it, and never receive the money. The buyer pays you in cash, in your hand, at the handover.\n\n2.3 The contract of sale is between you and the buyer. We are not a party to it, not your agent, and not your guarantor.\n\n2.4 That also means the obligations of a seller under the law of your country fall on you, not on us. If the buyer has a legal claim about the item, it is a claim against you.\n\n## 3. What you promise about every item you list\n\n3.1 You own the item, or you are legally authorised in writing to sell it.\n\n3.2 You physically have the item at the time you list it.\n\n3.3 The item is not stolen, and you have no reason to believe it is.\n\n3.4 The item is genuine. It is not counterfeit, not a replica sold as genuine, and does not carry a brand it was not made under.\n\n3.5 The item may lawfully be sold, owned, and advertised in the country where you are listing it, and it is not on the Prohibited and Restricted Items list.\n\n3.6 The description and the photographs are true, and they show the actual item you will hand over.\n\n3.7 You have disclosed every fault, damage, repair and missing part that you know about.\n\n3.8 The item is not subject to a manufacturer safety recall, and is not expired.\n\n3.9 You have removed your personal data from the item, including accounts, photographs, files, SIM cards and memory cards.\n\n3.10 These promises are given to the buyer and to us. Breaking them is a breach of these terms and may also be a breach of the law.\n\n## 4. Your listing\n\n4.1 Photograph the actual item, yourself, in good light, from more than one angle, including the faults.\n\n4.2 Do not use a photograph from the internet, from the manufacturer, or from another listing.\n\n4.3 Write a title that describes the item, not a slogan. Do not stuff it with words to appear in more searches.\n\n4.4 Put the item in the right category. If our automated systems fill in a category, a brand, a model or a condition from your photograph and title, check it. It is still your listing and your responsibility.\n\n4.5 Do not put a phone number, an address, a link, a social media handle, or an email in a listing.\n\n4.6 One listing per item. Do not republish the same item repeatedly to appear new.\n\n4.7 Update or close the listing as soon as the item is sold or is no longer available.\n\n## 5. Price\n\n5.1 The price you publish is the price you are offering to sell at.\n\n5.2 Do not raise the price after a buyer accepts it, and do not publish a low price to attract messages and then offer a different item.\n\n5.3 Any price band, suggested price, or estimate shown by lelbe3 is an automated estimate and not a valuation. Setting the price is your decision and your responsibility.\n\n5.4 You may negotiate through the structured offer flow. Once you accept an offer, you have agreed to sell at that price.\n\n## 6. Identity and value thresholds\n\n6.1 A verified phone number is enough to list items below the value threshold published in the app for your country.\n\n6.2 To list an item at or above that threshold, you must complete government identity verification.\n\n6.3 To run an auction, you must complete government identity verification.\n\n6.4 We may ask you to verify again, and we may hide your listings until you do.\n\n6.5 Do not attempt to avoid a threshold by splitting an item into parts, by understating a price, or by moving the deal off lelbe3.\n\n## 7. If you run an auction\n\n7.1 You set the starting price and the end time. Bidders are verified accounts and their bids are commitments.\n\n7.2 **You must sell to the highest bidder at the winning price.** Refusing earns a strike and can close your account.\n\n7.3 You may not bid on your own item, and you may not arrange for anyone else to bid on it to raise the price. This closes accounts immediately.\n\n7.4 You may not cancel an auction to avoid a price you do not like. We may allow cancellation for a genuine reason, for example the item was damaged or stolen before the end.\n\n7.5 Where a country requires a licence for auctions, auctions will not be available in that country. See Annex A of the Terms of Use.\n\n## 8. The handover\n\n8.1 Turn up at the time and place you agreed, or tell the buyer as early as you can that you cannot.\n\n8.2 Hand over the item you listed, in the condition you described, complete with everything you said was included.\n\n8.3 Let the buyer inspect and test the item before they pay. A buyer who is not allowed to inspect will walk away, and should.\n\n8.4 Take cash, count it in front of the buyer, and check large notes.\n\n8.5 Do not accept an advance payment, a transfer, a screenshot of a transfer, a cheque, or a payment from someone who is not the buyer.\n\n8.6 Confirm the handover in the app. This is what opens the ratings and what proves the deal happened.\n\n8.7 A confirmed no show earns a strike. See the Community and Safety Rules.\n\n## 9. After the sale\n\n9.1 A private sale of a used item is normally final once the buyer has inspected the item and paid for it. That is the ordinary expectation on lelbe3.\n\n9.2 **However, clause 9.1 does not override the law.** In several of the countries where lelbe3 operates, a buyer keeps rights that a seller cannot contract out of, in particular where the item was misdescribed, where a fault was hidden, where the item is not fit to be used at all, or where the seller is in fact a business. Where the law of the country of the handover gives the buyer such a right, that right applies and clause 9.1 does not remove it.\n\n9.3 If you hid a fault, misdescribed the item, or sold something you were not allowed to sell, the sale is your problem and not the buyer's. We will not defend you, and we will act on the report.\n\n9.4 You may offer your own return or guarantee terms at the handover. If you do, honour them. We do not enforce them and we are not party to them.\n\n9.5 lelbe3 cannot reverse a payment, cannot recover an item, and cannot order a refund. There is no escrow.\n\n## 10. Safety critical items\n\n10.1 If you list a child car seat, a cot, a pram, an electrical item, a battery, a gas appliance, a heater, a helmet, a ladder, or a power tool, clause 5 of the Prohibited and Restricted Items list applies to you in full.\n\n10.2 You must state the age of the item, its accident and repair history, and whether it is complete with its original safety parts.\n\n10.3 Some of these items may never be sold on lelbe3, including a child car seat that has been in a collision or is past its expiry date, and any recalled  sales is yours to declare and pay.\n\n13.2 We do not withhold tax, do not issue tax invoices for your sales, and do not report your sales to a tax authority unless a law requires us to.\n\n## 14. Your content\n\n14.1 You keep ownership of your photographs and descriptions, and you give us the licence set out in clause 13 of the Terms of Use so that we can display and promote your listing.\n\n14.2 You confirm that you took the photographs or have the right to use them.\n\n## 15. When we remove your listing or your account\n\n15.1 We may remove a listing, hide it from search, restrict a feature, or close your account, where we reasonably believe these terms or the law have been broken, or where there is a risk to buyers.\n\n15.2 We may do so without notice where the item is prohibited, unsafe, stolen, counterfeit, or where waiting would put someone at risk.\n\n15.3 We do not compensate you for a removed listing, for lost sales, for lost ranking, or for a closed account.\n\n15.4 You may appeal at [APPEALS CONTACT ADDRESS]. A human decides appeals about account closure.\n\n## 16. Your responsibility to us\n\n16.1 If a buyer, an authority, a brand owner, or anyone else brings a claim against lelbe3 because of something you sold or listed, and that claim results from your breach of these terms or of the law, you will cover our reasonable losses and legal costs.\n\n16.2 This does not apply to the extent the claim results from our own act or omission, and does not apply where the law of your country does not allow an indemnity of this kind against a consumer.\n\n## 17. Fees\n\n17.1 Selling on lelbe3 is free today. No listing fee, no commission on the sale price.\n\n17.2 If we introduce optional paid promotion, it will be optional and priced before you buy.\n\n17.3 If we ever introduce a mandatory fee or a commission, we will publish a new version of these terms and ask you to accept it before it applies to you.\n\n## 18. Changes and language\n\n18.1 Any change to these terms produces a new version number and effective date. A material change requires your acceptance before it applies to you.\n\n18.2 This document exists in Arabic and English, both at version 1.0, with identical clause numbers. The Arabic version governs.\n\n18.3 All numbers are written in Latin digits.\n"}}];

const KEY = 'lelbe3.admin.v1';
const load = () => {
  try { return JSON.parse(localStorage.getItem(KEY)) || structuredClone(SEED); }
  catch { return structuredClone(SEED); }
};
const save = () => localStorage.setItem(KEY, JSON.stringify(state.docs));

const state = { docs: load(), current: 0, lang: 'ar', tab: 'edit' };

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};

function renderList() {
  const host = document.getElementById('docList');
  host.replaceChildren();
  state.docs.forEach((d, i) => {
    const b = el('button', 'doc' + (i === state.current ? ' on' : ''));
    const title = el('b', null, d.titleAr);
    const pill = el('span', 'pill ' + (d.status === 'published' ? 'pub' : 'draft'),
                    d.status === 'published' ? 'منشور' : 'مسودة');
    title.appendChild(pill);
    b.appendChild(title);
    b.appendChild(el('small', null, d.titleEn + ' · النسخة ' + d.version));
    b.addEventListener('click', () => { state.current = i; render(); });
    host.appendChild(b);
  });
}

function renderEdit(d) {
  const host = document.getElementById('panel');
  host.replaceChildren();

  const head = el('div', 'between');
  const left = el('div');
  left.appendChild(el('h2', null, state.lang === 'ar' ? d.titleAr : d.titleEn));
  left.appendChild(el('div', 'meta',
    'المعرّف ' + d.id + ' · النسخة الحالية ' + d.version +
    ' · ' + (d.status === 'published' ? 'منشور' : 'مسودة غير منشورة')));
  head.appendChild(left);

  const seg = el('div', 'seg');
  ['ar', 'en'].forEach(l => {
    const b = el('button', state.lang === l ? 'on' : null, l === 'ar' ? 'العربية' : 'English');
    b.addEventListener('click', () => { state.lang = l; render(); });
    seg.appendChild(b);
  });
  head.appendChild(seg);
  host.appendChild(head);

  const note = el('div', 'note brand');
  note.textContent = 'النسخة العربية هي المعتمدة عند أي اختلاف. حرّر اللغتين معًا قبل النشر، '
    + 'وأبقِ ترقيم البنود متطابقًا بينهما.';
  note.style.marginTop = '16px';
  host.appendChild(note);

  const ta = el('textarea');
  ta.value = d.body[state.lang] || '';
  ta.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
  ta.addEventListener('input', () => {
    d.body[state.lang] = ta.value;
    d.status = 'draft';
    save();
    renderList();
    counter.textContent = ta.value.length + ' حرفًا';
  });
  host.appendChild(ta);

  const foot = el('div', 'between');
  foot.style.marginTop = '14px';
  const counter = el('div', 'meta', (d.body[state.lang] || '').length + ' حرفًا');
  foot.appendChild(counter);

  const actions = el('div', 'row');
  const revert = el('button', 'btn ghost', 'استرجع النص الأصلي');
  revert.addEventListener('click', () => {
    const seed = SEED.find(s => s.id === d.id);
    d.body[state.lang] = seed ? seed.body[state.lang] : '';
    save(); render();
  });
  const publish = el('button', 'btn', 'انشر نسخة جديدة');
  publish.addEventListener('click', () => openPublish(d));
  actions.appendChild(revert);
  actions.appendChild(publish);
  foot.appendChild(actions);
  host.appendChild(foot);
}

function bumpVersion(v) {
  const parts = String(v).split('.');
  const minor = parseInt(parts[1] || '0', 10) + 1;
  return (parts[0] || '1') + '.' + minor;
}

function openPublish(d) {
  const next = bumpVersion(d.version);
  document.getElementById('publishSummary').textContent =
    d.titleAr + ': من النسخة ' + d.version + ' إلى ' + next + '.';
  const btn = document.getElementById('confirmPublish');
  btn.onclick = () => {
    d.versions = d.versions || [];
    // Append only. A published version is never edited and never removed,
    // because a consent record pointing at a mutated document proves nothing.
    d.versions.push({ version: d.version, publishedAt: new Date().toISOString(),
                      ar: d.body.ar, en: d.body.en });
    d.version = next;
    d.status = 'published';
    save();
    publishDialog.close();
    render();
  };
  publishDialog.showModal();
}

function renderVersions(d) {
  const host = document.getElementById('panel');
  host.replaceChildren();
  host.appendChild(el('h2', null, 'سجل نسخ ' + d.titleAr));
  const note = el('div', 'note amber', 'السجل غير قابل للتعديل أو الحذف. '
    + 'كل موافقة مستخدم مرتبطة برقم نسخة، فإذا عُدّلت نسخة سابقة فقد السجل قيمته.');
  note.style.marginTop = '14px';
  host.appendChild(note);

  const rows = (d.versions || []).slice().reverse();
  if (!rows.length) {
    host.appendChild(el('p', 'meta', 'لم تُنشر أي نسخة بعد. النسخة الحالية '
      + d.version + ' ما زالت مسودة.'));
    return;
  }
  const t = el('table');
  const thead = el('tr');
  ['النسخة', 'تاريخ النشر', 'طول العربية', 'طول الإنجليزية'].forEach(h =>
    thead.appendChild(el('th', null, h)));
  t.appendChild(thead);
  rows.forEach(v => {
    const tr = el('tr');
    tr.appendChild(el('td', 'num', v.version));
    tr.appendChild(el('td', 'num', (v.publishedAt || '').slice(0, 10)));
    tr.appendChild(el('td', 'num', String((v.ar || '').length)));
    tr.appendChild(el('td', 'num', String((v.en || '').length)));
    t.appendChild(tr);
  });
  host.appendChild(t);
}

function renderConsent() {
  const host = document.getElementById('panel');
  host.replaceChildren();
  host.appendChild(el('h2', null, 'سجل الموافقات'));
  const note = el('div', 'note danger', 'هذه الشاشة فارغة عمدًا. سجل الموافقات يعيش في الخادم '
    + 'وليس في المتصفح، ولا يجوز أن يكون قابلًا للتعديل من هنا. تُعرض هنا للقراءة فقط '
    + 'بعد ربط Supabase.');
  note.style.marginTop = '14px';
  host.appendChild(note);

  const t = el('table');
  const thead = el('tr');
  ['المستخدم', 'المستند', 'النسخة', 'اللغة', 'الوقت', 'الطريقة'].forEach(h =>
    thead.appendChild(el('th', null, h)));
  t.appendChild(thead);
  const tr = el('tr');
  const td = el('td', 'meta', 'لا توجد سجلات. اربط الخادم لعرضها.');
  td.colSpan = 6;
  tr.appendChild(td);
  t.appendChild(tr);
  host.appendChild(t);
}

function render() {
  renderList();
  const d = state.docs[state.current];
  if (state.tab === 'edit') renderEdit(d);
  else if (state.tab === 'versions') renderVersions(d);
  else renderConsent();
  document.querySelectorAll('.tabs button').forEach(b =>
    b.classList.toggle('on', b.dataset.tab === state.tab));
}

document.querySelectorAll('.tabs button').forEach(b =>
  b.addEventListener('click', () => { state.tab = b.dataset.tab; render(); }));

render();
</script>
</body>
</html>
